name: Publish Flutter package to pub.dev

on:
  workflow_dispatch:
  push:
    paths:
      - 'pubspec.yaml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Format code
        run: dart format .

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: flutter test

      - name: Test publishing package
        run: dart pub publish --dry-run
