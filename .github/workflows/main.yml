name: Publish Flutter package to pub.dev

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'pubspec.yaml'

permissions:
  contents: write
  id-token: write   # required for pub.dev OIDC publishing

jobs:
  publish:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract version from pubspec.yaml
        id: pubspec
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '[:space:]')

          if [ -z "$VERSION" ]; then
            echo "❌ pubspec.yaml missing version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (tag v$VERSION)"

      - name: Check if Tag exists
        id: check_tag
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_SDK_IOS }}
        run: |
          TAG_NAME="${{ steps.pubspec.outputs.tag }}"
          REMOTE_REPO="pubstar-io/flutter-sdk"

          echo "Checking tag $TAG_NAME on $REMOTE_REPO..."

          if gh api repos/$REMOTE_REPO/git/ref/tags/$TAG_NAME >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists. Skipping publish to avoid error."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG_NAME does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pub get
        if: steps.check_tag.outputs.exists == 'false'
        run: flutter pub get

      - name: Format code
        if: steps.check_tag.outputs.exists == 'false'
        run: dart format .

      - name: Analyze
        if: steps.check_tag.outputs.exists == 'false'
        run: dart analyze

      - name: Run tests
        if: steps.check_tag.outputs.exists == 'false'
        run: flutter test

      - name: Test publishing package (dry run)
        if: steps.check_tag.outputs.exists == 'false'
        run: dart pub publish --dry-run

      - name: Zip project source code using git
        id: zip_step
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          ZIP_NAME="flutter_sdk_${{ steps.pubspec.outputs.version }}.zip"
          git archive -o "$ZIP_NAME" HEAD
          echo "zip_file=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload asset
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          repository: pubstar-io/flutter-sdk
          tag_name: ${{ steps.pubspec.outputs.tag }}
          target_commitish: main
          name: ${{ steps.pubspec.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.zip_step.outputs.zip_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_SDK_IOS }}

      # --- pub.dev authentication ---
      # Provide credentials via the PUB_CREDENTIALS secret (contents of
      # pub-credentials.json from a machine that ran `dart pub login`).
      # This works on self-hosted runners without OIDC. If you prefer OIDC,
      # remove this step and enable "Automated publishing" for the package
      # on pub.dev (the id-token: write permission above is already set).
      - name: Setup pub.dev credentials
        if: steps.check_tag.outputs.exists == 'false'
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          if [ -z "$PUB_CREDENTIALS" ]; then
            echo "PUB_CREDENTIALS secret is empty — relying on OIDC (Automated publishing must be enabled on pub.dev)."
            exit 0
          fi
          mkdir -p "$HOME/.config/dart"
          printf '%s' "$PUB_CREDENTIALS" > "$HOME/.config/dart/pub-credentials.json"

      - name: Publish to pub.dev
        if: steps.check_tag.outputs.exists == 'false'
        run: dart pub publish --force
